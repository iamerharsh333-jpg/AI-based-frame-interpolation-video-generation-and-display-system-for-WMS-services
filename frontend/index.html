<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cosmic Venturer | WMS Frame Interpolation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@9.2.4/ol.css" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <header class="brand">
          <span class="brand-mark">CV</span>
          <div>
            <h1>Cosmic Venturer</h1>
            <p>AI-assisted WMS frame interpolation</p>
          </div>
        </header>

        <section class="panel">
          <div class="tabs" role="tablist" aria-label="Frame source">
            <button class="tab active" id="tab-wms" type="button">WMS</button>
            <button class="tab" id="tab-upload" type="button">Upload</button>
          </div>

          <form id="wms-form" class="form-view">
            <label>
              WMS endpoint
              <input name="base_url" type="url" placeholder="https://server.example/wms" required />
            </label>
            <label>
              Layer name
              <input name="layers" type="text" placeholder="namespace:layer" required />
            </label>
            <label>
              BBOX
              <input name="bbox" type="text" value="-180,-90,180,90" required />
            </label>
            <div class="grid-2">
              <label>
                CRS
                <input name="crs" type="text" value="EPSG:4326" />
              </label>
              <label>
                Version
                <select name="version">
                  <option value="1.3.0">1.3.0</option>
                  <option value="1.1.1">1.1.1</option>
                </select>
              </label>
            </div>
            <label>
              Times
              <textarea name="times" rows="4" placeholder="2024-09-29T00:00:00Z&#10;2024-09-29T00:30:00Z" required></textarea>
            </label>
            <button class="primary" type="submit">Generate WMS video</button>
          </form>

          <form id="upload-form" class="form-view hidden">
            <label>
              Satellite frames
              <input name="files" type="file" accept="image/*" multiple required />
            </label>
            <p class="hint">Select two or more time-ordered frames. The backend resizes mixed dimensions safely.</p>
            <button class="primary" type="submit">Generate uploaded video</button>
          </form>
        </section>

        <section class="panel settings-panel">
          <h2>Rendering</h2>
          <div class="grid-2">
            <label>
              In-betweens
              <input id="inbetweens" type="number" min="0" max="30" value="5" />
            </label>
            <label>
              FPS
              <input id="fps" type="number" min="1" max="60" value="12" />
            </label>
          </div>
          <label>
            Method
            <select id="method">
              <option value="optical_flow">Optical flow</option>
              <option value="blend">Blend fallback</option>
            </select>
          </label>
        </section>

        <section class="status-panel" aria-live="polite">
          <div id="status-dot" class="status-dot"></div>
          <p id="status">Ready to generate a satellite video.</p>
        </section>
      </aside>

      <section class="map-stage">
        <div id="map" class="map"></div>
        <div class="toolbar">
          <button id="fit-world" type="button" title="Fit world extent">Fit</button>
          <button id="clear-video" type="button" title="Remove video overlay">Clear</button>
        </div>
        <section class="result-strip">
          <video id="result-video" controls muted loop playsinline></video>
          <div>
            <h2>Generated sequence</h2>
            <p id="result-meta">No video generated yet.</p>
          </div>
        </section>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/ol@9.2.4/dist/ol.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
